<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>data-wrangler control</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16171a;
        --panel: #1f2125;
        --line: #2e3137;
        --text: #d8dade;
        --muted: #8a8f98;
        --ok: #4cc38a;
        --warn: #e8b04a;
        --err: #ef5f5f;
        --accent: #6ea8fe;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 system-ui, sans-serif;
        height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header h1 {
        font-size: 14px;
        margin: 0 8px 0 0;
        font-weight: 600;
      }
      select,
      input,
      button {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 6px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .pill.ok::before {
        background: var(--ok);
      }
      .pill.warn::before {
        background: var(--warn);
      }
      .pill.err::before {
        background: var(--err);
      }
      .spacer {
        flex: 1;
      }
      #banners:empty {
        display: none;
      }
      .banner {
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
      }
      .banner.warn {
        background: #3a2f17;
        color: #f3d38c;
      }
      .banner.err {
        background: #3a1b1b;
        color: #f5a3a3;
      }
      main {
        display: grid;
        grid-template-columns: 340px 1fr;
        min-height: 0;
      }
      #pane {
        border-right: 1px solid var(--line);
        overflow: auto;
        padding: 8px;
      }
      /* Sections take what they need; the log fills the rest (at least 100 px, else the column scrolls). */
      #calibration-details summary {
        cursor: pointer;
        list-style: none;
      }
      #calibration-details summary h2 {
        display: inline;
      }
      #calibration-details summary::before {
        content: '▸ ';
        color: var(--muted);
      }
      #calibration-details[open] summary::before {
        content: '▾ ';
      }
      .calib-toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin: 6px 0;
      }
      .calib-svg {
        display: block;
        width: 100%;
        max-width: 640px;
        background: #0c0d0f;
        border: 1px solid var(--line);
        border-radius: 4px;
        touch-action: none;
        outline: none;
      }
      .calib-svg:focus {
        border-color: var(--accent);
      }
      .calib-window {
        fill: none;
        stroke: var(--muted);
        stroke-width: 0.004;
        stroke-dasharray: 0.015 0.01;
      }
      .calib-quad {
        fill: rgba(110, 168, 254, 0.12);
        stroke: var(--accent);
        stroke-width: 0.004;
      }
      .calib-handle {
        cursor: grab;
      }
      .calib-readout {
        margin-top: 4px;
      }
      #side {
        display: flex;
        flex-direction: column;
        min-height: 0;
        overflow: auto;
      }
      #side > section {
        flex: none;
      }
      #side > #log {
        flex: 1 0 100px;
      }
      #preview-section[hidden] {
        display: none;
      }
      /* 16:9, as wide as the column but never taller than ~36% of the window. */
      #preview-box {
        aspect-ratio: 16 / 9;
        width: 100%;
        max-width: calc(36vh * 16 / 9);
        background: #000;
        border: 1px solid var(--line);
      }
      #preview-box iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        pointer-events: none;
      }
      /* Edit mode: the header controls, a large preview with an outline, the selected layer. */
      .edit-controls {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      body:not(.editing) .edit-controls .seg,
      body:not(.editing) .edit-controls label:last-child {
        opacity: 0.5;
      }
      .seg {
        display: inline-flex;
      }
      .seg button {
        border-radius: 0;
        margin-left: -1px;
      }
      .seg button:first-child {
        border-radius: 4px 0 0 4px;
        margin-left: 0;
      }
      .seg button:last-child {
        border-radius: 0 4px 4px 0;
      }
      .seg button.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #0c0d0f;
      }
      #edit-badge {
        display: none;
        margin-bottom: 6px;
        color: var(--accent);
        font-weight: 600;
      }
      body.editing #edit-badge {
        display: block;
      }
      body.editing #preview-box {
        max-width: calc(78vh * 16 / 9);
        outline: 2px solid var(--accent);
        outline-offset: 2px;
        box-shadow: 0 0 0 6px rgba(110, 168, 254, 0.18);
      }
      body.editing #preview-box iframe {
        pointer-events: auto;
      }
      body.editing #side > section:not(#preview-section) {
        opacity: 0.7;
      }
      .dw-layer-selected {
        box-shadow: inset 3px 0 0 var(--accent);
        background: rgba(110, 168, 254, 0.08);
        border-radius: 4px;
      }
      .dw-layer-selected > .tp-fldv_b {
        color: var(--accent);
        font-weight: 600;
      }
      #datasets-section {
        max-height: 34vh;
        overflow: auto;
      }
      .ds-toolbar {
        display: flex;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .dataset {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 6px 8px;
        margin-bottom: 8px;
      }
      .ds-head {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 4px;
      }
      .ds-head select {
        max-width: 200px;
      }
      table.cols {
        border-collapse: collapse;
        width: 100%;
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
      }
      table.cols th,
      table.cols td {
        text-align: left;
        padding: 2px 10px 2px 0;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }
      table.cols th {
        color: var(--muted);
        font-weight: normal;
      }
      ul.issues {
        margin: 6px 0 0;
        padding-left: 18px;
      }
      .warn {
        color: var(--warn);
      }
      .error {
        color: var(--err);
      }
      section {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      section h2 {
        margin: 0 0 6px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #outputs table {
        border-collapse: collapse;
        width: 100%;
      }
      #outputs td,
      #outputs th {
        text-align: left;
        padding: 2px 8px 2px 0;
        font-variant-numeric: tabular-nums;
      }
      #outputs th {
        color: var(--muted);
        font-weight: normal;
      }
      #log {
        overflow: auto;
        font: 12px/1.45 ui-monospace, monospace;
        padding: 6px 12px;
        min-height: 0;
      }
      #log div {
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .warn {
        color: var(--warn);
      }
      #log .error {
        color: var(--err);
      }
      #log .time {
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>data-wrangler</h1>
      <label>Project <select id="project-select"></select></label>
      <input id="project-new" placeholder="new project name" size="16" />
      <button id="project-create">Create</button>
      <span class="spacer"></span>
      <label title="Show a live preview of the output (hiding it frees the GPU it uses)"
        ><input type="checkbox" id="preview-toggle" checked /> preview</label
      >
      <span class="edit-controls">
        <label title="Edit layer transforms and the 3D camera directly in the preview"
          ><input type="checkbox" id="edit-toggle" /> edit</label
        >
        <span id="gizmo-modes" class="seg" role="group" aria-label="Gizmo mode"></span>
        <label title="Snap: 10/50 px when moving, 5/15° when rotating, 0.05/0.25 when scaling"
          >snap <select id="snap-select"></select
        ></label>
      </span>
      <span id="conn" class="pill">server</span>
      <span id="out-pill" class="pill">output</span>
    </header>
    <div id="banners"></div>
    <main>
      <div id="pane"></div>
      <div id="side">
        <section id="preview-section">
          <div id="edit-badge"></div>
          <div id="preview-box"></div>
        </section>
        <section id="outputs">
          <h2>Output windows</h2>
          <div id="outputs-body" class="muted">No output window connected.</div>
        </section>
        <section id="calibration-section">
          <details id="calibration-details">
            <summary><h2>Output calibration</h2></summary>
            <div id="calibration"></div>
          </details>
        </section>
        <section id="datasets-section">
          <h2>Datasets</h2>
          <div class="ds-toolbar">
            <label><button type="button" id="import-button">Import file…</button></label>
            <input id="import-file" type="file" accept=".csv,.tsv,.txt,.json" hidden />
            <span class="muted">CSV, TSV or JSON. Copied into the project unchanged.</span>
          </div>
          <div id="datasets"></div>
        </section>
        <section id="problems-section">
          <h2>Problems</h2>
          <div id="problems" class="muted">None.</div>
        </section>
        <div id="log"></div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
