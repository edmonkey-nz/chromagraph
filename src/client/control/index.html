<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>data-wrangler control</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #16171a;
        --panel: #1f2125;
        --line: #2e3137;
        --text: #d8dade;
        --muted: #8a8f98;
        --ok: #4cc38a;
        --warn: #e8b04a;
        --err: #ef5f5f;
        --accent: #6ea8fe;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.4 system-ui, sans-serif;
        height: 100vh;
        display: grid;
        grid-template-rows: auto auto 1fr;
      }
      header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 12px;
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
      }
      header h1 {
        font-size: 14px;
        margin: 0 8px 0 0;
        font-weight: 600;
      }
      select,
      input,
      button {
        font: inherit;
        color: var(--text);
        background: var(--bg);
        border: 1px solid var(--line);
        border-radius: 4px;
        padding: 3px 6px;
      }
      button {
        cursor: pointer;
      }
      button:hover {
        border-color: var(--accent);
      }
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        border: 1px solid var(--line);
        color: var(--muted);
        white-space: nowrap;
      }
      .pill::before {
        content: '';
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--muted);
      }
      .pill.ok::before {
        background: var(--ok);
      }
      .pill.warn::before {
        background: var(--warn);
      }
      .pill.err::before {
        background: var(--err);
      }
      .spacer {
        flex: 1;
      }
      #banners:empty {
        display: none;
      }
      .banner {
        padding: 6px 12px;
        border-bottom: 1px solid var(--line);
      }
      .banner.warn {
        background: #3a2f17;
        color: #f3d38c;
      }
      .banner.err {
        background: #3a1b1b;
        color: #f5a3a3;
      }
      main {
        display: grid;
        grid-template-columns: 340px 1fr;
        min-height: 0;
      }
      #pane {
        border-right: 1px solid var(--line);
        overflow: auto;
        padding: 8px;
      }
      #side {
        display: grid;
        grid-template-rows: auto auto 1fr;
        min-height: 0;
      }
      section {
        padding: 8px 12px;
        border-bottom: 1px solid var(--line);
      }
      section h2 {
        margin: 0 0 6px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      #outputs table {
        border-collapse: collapse;
        width: 100%;
      }
      #outputs td,
      #outputs th {
        text-align: left;
        padding: 2px 8px 2px 0;
        font-variant-numeric: tabular-nums;
      }
      #outputs th {
        color: var(--muted);
        font-weight: normal;
      }
      #log {
        overflow: auto;
        font: 12px/1.45 ui-monospace, monospace;
        padding: 6px 12px;
        min-height: 0;
      }
      #log div {
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .warn {
        color: var(--warn);
      }
      #log .error {
        color: var(--err);
      }
      #log .time {
        color: var(--muted);
      }
      .muted {
        color: var(--muted);
      }
      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>data-wrangler</h1>
      <label>Project <select id="project-select"></select></label>
      <input id="project-new" placeholder="new project name" size="16" />
      <button id="project-create">Create</button>
      <span class="spacer"></span>
      <span id="conn" class="pill">server</span>
      <span id="out-pill" class="pill">output</span>
    </header>
    <div id="banners"></div>
    <main>
      <div id="pane"></div>
      <div id="side">
        <section id="outputs">
          <h2>Output windows</h2>
          <div id="outputs-body" class="muted">No output window connected.</div>
        </section>
        <section id="problems-section">
          <h2>Problems</h2>
          <div id="problems" class="muted">None.</div>
        </section>
        <div id="log"></div>
      </div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
