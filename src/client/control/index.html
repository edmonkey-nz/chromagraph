<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>data-wrangler control</title>
    <style>
      /* ---- tokens --------------------------------------------------------------------- */
      :root {
        color-scheme: dark;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, sans-serif;
        --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Ubuntu Mono', Menlo, monospace;
        --bg: #0d0f13;
        --card: #161920;
        --card-head: #191d25;
        --raised: #1e232c;
        --field: #0f1217;
        --line: #252a34;
        --line-soft: rgba(255, 255, 255, 0.05);
        --text: #e3e6ec;
        --text-2: #b6bcc8;
        --muted: #7e8695;
        --accent: #8db4ff;
        --accent-strong: #6d9cff;
        --accent-weak: rgba(141, 180, 255, 0.14);
        --accent-ring: rgba(141, 180, 255, 0.55);
        --on-accent: #0c1220;
        --ok: #5fcb9b;
        --warn: #e8bb5e;
        --err: #f07c7c;
        --radius: 12px;
        --radius-s: 8px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.2);
        --gap: 12px;
        --preview-w: clamp(360px, 28vw, 560px);

        /* Tweakpane, themed to sit inside the cards. */
        --tp-base-background-color: transparent;
        --tp-base-shadow-color: transparent;
        --tp-base-border-radius: 0px;
        --tp-base-font-family: var(--font);
        --tp-blade-border-radius: 6px;
        --tp-blade-horizontal-padding: 6px;
        --tp-blade-value-width: 58%;
        --tp-container-horizontal-padding: 6px;
        --tp-container-vertical-padding: 6px;
        --tp-container-unit-size: 22px;
        --tp-container-unit-spacing: 6px;
        --tp-container-background-color: rgba(255, 255, 255, 0.035);
        --tp-container-background-color-hover: rgba(255, 255, 255, 0.06);
        --tp-container-background-color-focus: rgba(255, 255, 255, 0.08);
        --tp-container-background-color-active: rgba(255, 255, 255, 0.1);
        --tp-container-foreground-color: var(--text-2);
        --tp-input-background-color: rgba(0, 0, 0, 0.3);
        --tp-input-background-color-hover: rgba(0, 0, 0, 0.4);
        --tp-input-background-color-focus: rgba(0, 0, 0, 0.48);
        --tp-input-background-color-active: rgba(0, 0, 0, 0.52);
        --tp-input-foreground-color: var(--text);
        --tp-button-background-color: rgba(141, 180, 255, 0.16);
        --tp-button-background-color-hover: rgba(141, 180, 255, 0.24);
        --tp-button-background-color-focus: rgba(141, 180, 255, 0.28);
        --tp-button-background-color-active: rgba(141, 180, 255, 0.34);
        --tp-button-foreground-color: #dce7ff;
        --tp-label-foreground-color: var(--muted);
        --tp-groove-foreground-color: rgba(255, 255, 255, 0.09);
        --tp-monitor-background-color: rgba(0, 0, 0, 0.22);
        --tp-monitor-foreground-color: var(--text-2);
      }

      /* ---- base ----------------------------------------------------------------------- */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 var(--font);
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto auto auto minmax(0, 1fr);
      }
      [hidden] {
        display: none !important;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .warn {
        color: var(--warn);
      }
      .error {
        color: var(--err);
      }
      .spacer {
        flex: 1;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      ::selection {
        background: var(--accent-weak);
      }
      /* Thin, quiet scrollbars. */
      * {
        scrollbar-width: thin;
        scrollbar-color: #2c323d transparent;
      }

      /* ---- form controls ------------------------------------------------------------------ */
      select,
      input,
      button {
        font: inherit;
        color: var(--text);
      }
      select,
      input[type='text'],
      input:not([type]) {
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        padding: 5px 8px;
        min-height: 30px;
      }
      select {
        padding-right: 6px;
      }
      input[type='checkbox'] {
        accent-color: var(--accent-strong);
        width: 15px;
        height: 15px;
        margin: 0;
        vertical-align: -2px;
      }
      input[type='range'] {
        accent-color: var(--accent-strong);
      }
      /* Plain buttons built by older panels (datasets, calibration) look like small .btn. */
      button:not([class]) {
        min-height: 28px;
        padding: 2px 10px;
        border-radius: var(--radius-s);
        border: 1px solid var(--line);
        background: var(--raised);
        cursor: pointer;
        font-size: 12px;
      }
      button:not([class]):hover {
        background: #252b36;
        border-color: #323946;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 30px;
        padding: 4px 12px;
        border-radius: var(--radius-s);
        border: 1px solid var(--line);
        background: var(--raised);
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 0.12s,
          border-color 0.12s;
      }
      .btn:hover:not(:disabled) {
        background: #252b36;
        border-color: #323946;
      }
      .btn.primary {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
        color: var(--on-accent);
        font-weight: 600;
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--accent);
        border-color: var(--accent);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--text-2);
      }
      .btn.ghost:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.05);
        border-color: transparent;
        color: var(--text);
      }
      .btn.small {
        min-height: 26px;
        padding: 2px 10px;
        font-size: 12px;
      }
      .btn.danger {
        color: var(--err);
      }
      .btn:disabled,
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-s);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .icon-btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
      }
      .icon-btn.danger:hover:not(:disabled) {
        color: var(--err);
      }
      .icon {
        flex: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent-ring);
        outline-offset: 2px;
      }
      select:focus-visible,
      input:focus-visible {
        outline-offset: 0;
        border-color: var(--accent);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toolbar.wrap {
        flex-wrap: wrap;
      }
      .toolbar.split > * {
        flex: 1;
      }
      label.check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }

      /* ---- pills and badges ------------------------------------------------------------------ */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-2);
        font-size: 12px;
        white-space: nowrap;
      }
      .pill::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .pill.ok::before {
        background: var(--ok);
      }
      .pill.warn::before {
        background: var(--warn);
      }
      .pill.err::before {
        background: var(--err);
      }
      .badge {
        display: inline-block;
        min-width: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-2);
        font-size: 11px;
        line-height: 18px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .badge:empty {
        display: none;
      }
      .badge.err {
        background: rgba(240, 124, 124, 0.2);
        color: #ffc4c4;
      }
      .badge.warn {
        background: rgba(232, 187, 94, 0.2);
        color: #ffe2a8;
      }

      /* ---- header ------------------------------------------------------------------------------ */
      .app-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line-soft);
        background: linear-gradient(#12151b, #101318);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 650;
        font-size: 14px;
        letter-spacing: 0.01em;
        margin-right: 8px;
      }
      .brand-mark {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: conic-gradient(from 210deg, var(--accent-strong), #9ae6c8, var(--accent-strong));
        box-shadow: 0 0 12px rgba(141, 180, 255, 0.35);
      }
      .project-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .project-bar select {
        min-width: 160px;
        max-width: 260px;
        font-weight: 600;
      }
      .divider {
        width: 1px;
        height: 20px;
        background: var(--line);
        margin: 0 4px;
      }
      .save-state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 6px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .save-state::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
      }
      .save-state.busy::before {
        background: var(--accent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .save-state.warn {
        color: var(--warn);
      }
      .save-state.warn::before {
        background: var(--warn);
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      /* Snapshots menu (popover). */
      .popover {
        margin: 0;
        position: fixed;
        inset: auto;
        width: 420px;
        max-height: min(70vh, 560px);
        overflow: auto;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--text);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      }
      .popover-title {
        font-size: 14px;
        margin-bottom: 4px;
      }
      .popover > p {
        margin: 0 0 12px;
      }
      .snapshot-list {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .snapshot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: var(--radius-s);
        background: rgba(255, 255, 255, 0.03);
      }
      .snapshot-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .snapshot-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 550;
      }
      .snapshot-actions {
        display: flex;
        gap: 4px;
      }

      /* Name dialog. */
      .dialog {
        width: min(440px, calc(100vw - 32px));
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--text);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      }
      .dialog::backdrop {
        background: rgba(5, 6, 9, 0.6);
      }
      .dialog h2 {
        font-size: 15px;
        margin-bottom: 12px;
      }
      .dialog-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--text-2);
      }
      .dialog-error {
        min-height: 20px;
        margin: 6px 0 0;
        color: var(--err);
        font-size: 12px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 8px;
      }

      /* ---- banners -------------------------------------------------------------------------------- */
      #banners {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 16px 0;
      }
      #banners:empty {
        display: none;
      }
      .banner {
        padding: 8px 12px;
        border-radius: var(--radius-s);
        border: 1px solid transparent;
      }
      .banner.warn {
        background: rgba(232, 187, 94, 0.1);
        border-color: rgba(232, 187, 94, 0.25);
        color: #f6d999;
      }
      .banner.err {
        background: rgba(240, 124, 124, 0.1);
        border-color: rgba(240, 124, 124, 0.28);
        color: #ffb8b8;
      }
      .banner button {
        margin-left: 8px;
      }

      /* ---- cards ---------------------------------------------------------------------------------- */
      .card {
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 6px 6px 4px;
        border-radius: var(--radius) var(--radius) 0 0;
      }
      .card.collapsed .card-head {
        border-radius: var(--radius);
      }
      .card-toggle {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        border: 0;
        border-radius: var(--radius-s);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .card-toggle:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .card-toggle .icon {
        color: var(--muted);
        transform: rotate(90deg);
        transition: transform 0.15s;
      }
      .card.collapsed .card-toggle .icon {
        transform: none;
      }
      .card-title {
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card-note {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .card-actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .card-body {
        padding: 2px 10px 12px;
      }
      .card-body > .tp-rotv,
      .scene-transition .tp-rotv {
        font-size: 12px;
      }
      .sub-head {
        margin: 14px 2px 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .empty-note {
        margin: 8px 2px;
      }

      /* Tweakpane inside cards: softer folders, readable labels. */
      .card .tp-rotv {
        box-shadow: none;
        font-weight: 450;
      }
      .card .tp-fldv_b {
        border-radius: 6px;
      }
      .card .tp-fldv_t {
        font-weight: 600;
        color: var(--text-2);
      }
      .card .tp-lblv_l {
        color: var(--muted);
      }
      .card .tp-btnv_b {
        border-radius: 6px;
        font-weight: 550;
      }

      /* ---- top band: preview + data tabs ---------------------------------------------------------- */
      .top-band {
        display: grid;
        grid-template-columns: var(--preview-w) minmax(0, 1fr);
        gap: var(--gap);
        padding: var(--gap) 16px 0;
        /* Preview height plus its toolbar; declared here so it follows --preview-w in edit mode. */
        height: calc(var(--preview-w) * 9 / 16 + 48px + var(--gap));
      }
      .preview-panel {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .preview-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        min-height: 46px;
        padding: 8px 10px;
      }
      .preview-toolbar .title {
        font-weight: 600;
        margin-right: auto;
      }
      .edit-controls {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      body:not(.editing) #gizmo-modes,
      body:not(.editing) .snap-label {
        display: none;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        border-radius: var(--radius-s);
        background: var(--field);
        border: 1px solid var(--line);
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--text-2);
        padding: 2px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
      }
      .seg button.active {
        background: var(--accent-weak);
        color: var(--accent);
      }
      .snap-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
      }
      .snap-label select {
        min-height: 26px;
        padding: 2px 4px;
      }
      #preview-box {
        position: relative;
        flex: none;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-top: 1px solid var(--line-soft);
      }
      #preview-box iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        pointer-events: none;
      }
      #preview-off {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
        background: repeating-linear-gradient(135deg, #0f1115 0 12px, #12151a 12px 24px);
        color: var(--muted);
      }
      #edit-badge {
        position: absolute;
        left: 8px;
        top: 8px;
        z-index: 1;
        max-width: calc(100% - 16px);
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(10, 14, 22, 0.8);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        pointer-events: none;
        display: none;
      }
      body.editing #edit-badge {
        display: block;
      }
      /* Edit mode: a much larger preview that spans into the tab area, with an accent ring. */
      body.editing {
        --preview-w: min(calc(52vh * 16 / 9), calc(100vw - 32px - 380px - var(--gap)));
      }
      body.editing .preview-panel {
        box-shadow:
          0 0 0 2px var(--accent-ring),
          var(--shadow);
      }
      body.editing #preview-box iframe {
        pointer-events: auto;
      }

      .data-tabs {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }
      .tablist {
        display: flex;
        gap: 2px;
        padding: 6px 8px 0;
        border-bottom: 1px solid var(--line-soft);
        overflow-x: auto;
      }
      .tablist [role='tab'] {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px 9px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--muted);
        font-weight: 550;
        cursor: pointer;
        white-space: nowrap;
        border-radius: 6px 6px 0 0;
      }
      .tablist [role='tab']:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.03);
      }
      .tablist [role='tab'][aria-selected='true'] {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      .tabpanels {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      [role='tabpanel'] {
        position: absolute;
        inset: 0;
        overflow: auto;
        padding: 12px 14px;
      }

      /* Datasets tab. */
      .ds-toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 10px;
      }
      #datasets {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(420px, 1fr));
        gap: 10px;
        align-items: start;
      }
      .dataset {
        border: 1px solid var(--line-soft);
        background: rgba(255, 255, 255, 0.02);
        border-radius: var(--radius-s);
        padding: 8px 10px;
        min-width: 0;
      }
      .ds-head {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .ds-head select {
        max-width: 200px;
      }
      .ds-body {
        overflow-x: auto;
      }
      table.cols {
        border-collapse: collapse;
        width: 100%;
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      table.cols th,
      table.cols td {
        text-align: left;
        padding: 3px 10px 3px 0;
        border-bottom: 1px solid var(--line-soft);
        vertical-align: top;
      }
      table.cols th {
        color: var(--muted);
        font-weight: 500;
      }
      ul.issues {
        margin: 6px 0 0;
        padding-left: 18px;
      }

      /* Output windows tab. */
      #outputs-body table {
        border-collapse: collapse;
        width: 100%;
        font-variant-numeric: tabular-nums;
      }
      #outputs-body td,
      #outputs-body th {
        text-align: left;
        padding: 4px 12px 4px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      #outputs-body th {
        color: var(--muted);
        font-weight: 500;
      }

      /* Calibration tab: controls on the left, the corner editor sized to the panel height. */
      #calibration {
        display: grid;
        grid-template-columns: minmax(240px, 1fr) auto;
        grid-template-rows: auto 1fr;
        gap: 8px 16px;
        height: 100%;
      }
      .calib-toolbar {
        grid-column: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        align-content: start;
      }
      .calib-readout {
        grid-column: 1;
        grid-row: 2;
        font-size: 12px;
      }
      .calib-svg {
        grid-column: 2;
        grid-row: 1 / span 2;
        display: block;
        height: 100%;
        max-height: 100%;
        width: auto;
        max-width: 100%;
        aspect-ratio: 1.24 / 0.8025;
        background: #0a0b0e;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        touch-action: none;
        outline: none;
      }
      .calib-svg:focus-visible {
        border-color: var(--accent);
      }
      .calib-window {
        fill: none;
        stroke: var(--muted);
        stroke-width: 0.004;
        stroke-dasharray: 0.015 0.01;
      }
      .calib-quad {
        fill: rgba(141, 180, 255, 0.12);
        stroke: var(--accent);
        stroke-width: 0.004;
      }
      .calib-handle {
        cursor: grab;
      }

      /* Problems and log tabs. */
      #problems > div {
        padding: 6px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      #panel-log {
        padding: 0;
      }
      #log {
        height: 100%;
        overflow: auto;
        font: 12px/1.5 var(--mono);
        padding: 8px 14px;
      }
      #log div {
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .warn {
        color: var(--warn);
      }
      #log .error {
        color: var(--err);
      }
      #log .time {
        color: var(--muted);
      }

      /* ---- workspace: columns of cards ------------------------------------------------------------- */
      /* Wide: [show] [look] [layers x2]. Each zone scrolls on its own, like strips on a desk. */
      .workspace {
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 2fr);
        gap: var(--gap);
        padding: var(--gap) 16px var(--gap);
        min-height: 0;
      }
      .side {
        display: contents;
      }
      .zone {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        min-height: 0;
        overflow-y: auto;
        padding: 2px 4px 24px 2px;
        scrollbar-gutter: stable;
      }
      .zone-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 2px 0 4px;
        min-height: 34px;
      }
      .zone-title {
        font-size: 15px;
        letter-spacing: 0.01em;
      }
      .zone-note {
        color: var(--muted);
      }
      .layer-columns {
        display: grid;
        grid-template-columns: repeat(var(--cols, 1), minmax(0, 1fr));
        gap: var(--gap);
        align-items: start;
      }
      .layer-columns[data-columns='2'] {
        --cols: 2;
      }
      .layer-col {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        min-width: 0;
      }
      .empty-card {
        padding: 16px;
      }
      .empty-card p {
        margin: 0;
      }

      /* Layer cards: number badge, selection ring, dimmed when off. */
      .layer-card .card-head {
        background: var(--card-head);
      }
      .card-badge:empty {
        display: none;
      }
      .card-badge {
        display: inline-grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text-2);
        font-size: 11px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .layer-card.selected {
        border-color: rgba(141, 180, 255, 0.45);
        box-shadow:
          0 0 0 1px rgba(141, 180, 255, 0.35),
          var(--shadow);
      }
      .layer-card.selected .card-head {
        background: linear-gradient(90deg, rgba(141, 180, 255, 0.14), rgba(141, 180, 255, 0.04));
      }
      .layer-card.selected .card-badge {
        background: var(--accent-strong);
        color: var(--on-accent);
      }
      .layer-card.off .card-title {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: rgba(255, 255, 255, 0.25);
      }

      /* ---- scenes ------------------------------------------------------------------------------------ */
      .scene-list {
        list-style: none;
        margin: 10px 0 8px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .scene-row {
        position: relative;
        border-radius: var(--radius-s);
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid transparent;
        overflow: hidden;
      }
      .scene-row.active {
        background: var(--accent-weak);
        border-color: rgba(141, 180, 255, 0.4);
      }
      .scene-main {
        display: flex;
        align-items: center;
        gap: 2px;
        padding-right: 4px;
      }
      .scene-go {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-rows: auto auto;
        column-gap: 10px;
        align-items: center;
        padding: 7px 10px;
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
        border-radius: var(--radius-s);
      }
      .scene-go:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .scene-num {
        grid-row: 1 / span 2;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text-2);
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .scene-row.active .scene-num {
        background: var(--accent-strong);
        color: var(--on-accent);
      }
      .scene-name {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .scene-edited {
        display: none;
        font-size: 11px;
        color: var(--warn);
        padding: 0 6px;
        border-radius: 999px;
        background: rgba(232, 187, 94, 0.12);
      }
      .scene-row.edited .scene-edited {
        display: inline-block;
      }
      .scene-meta {
        grid-column: 2 / span 2;
        color: var(--muted);
        font-size: 12px;
      }
      .scene-progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        opacity: 0;
      }
      .scene-row.morphing .scene-progress {
        opacity: 1;
      }
      .scene-bar {
        display: block;
        height: 100%;
        background: var(--accent);
        transform-origin: left;
        transform: scaleX(1);
      }
      .scene-detail {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 10px 12px;
        border-top: 1px solid var(--line-soft);
      }
      .range-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .range-row input[type='range'] {
        flex: 1;
        min-width: 80px;
      }
      .range-row output {
        width: 44px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--text-2);
      }
      .scene-transition {
        margin: 0 -4px;
      }

      /* ---- responsive --------------------------------------------------------------------------------- */
      /* Medium (about 1100–1500 px): two columns; show + look stacked on the left, layers on the right. */
      @media (max-width: 1499px) {
        .workspace {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.25fr);
        }
        .side {
          display: flex;
          flex-direction: column;
          gap: var(--gap);
          min-height: 0;
          overflow-y: auto;
          padding: 2px 4px 24px 2px;
          scrollbar-gutter: stable;
        }
        .side > .zone {
          overflow: visible;
          padding: 0;
          flex: none;
        }
      }
      /* Narrow or short: one column and the page scrolls as a whole. */
      @media (max-width: 1099px), (max-height: 640px) {
        body {
          height: auto;
          overflow: visible;
          display: block;
        }
        .top-band {
          height: auto;
          grid-template-columns: minmax(0, 1fr);
          padding-bottom: 0;
        }
        .data-tabs {
          height: 340px;
        }
        .workspace {
          display: flex;
          flex-direction: column;
        }
        .side,
        .zone {
          overflow: visible;
          padding: 0;
        }
        body.editing {
          --preview-w: 100%;
        }
      }
      @media (max-width: 1099px) {
        .top-band {
          --preview-w: 100%;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
        .scene-bar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>data-wrangler</div>
      <div class="project-bar" role="group" aria-label="Project">
        <select id="project-select" aria-label="Open project"></select>
        <button type="button" id="project-new" class="btn ghost" title="Create an empty project">New…</button>
        <span class="divider" aria-hidden="true"></span>
        <button type="button" id="save-button" class="btn" title="Write the project to disk now (it also saves automatically)">Save</button>
        <button type="button" id="save-as-button" class="btn ghost" title="Copy this project and its data to a new name, then open the copy">Save as…</button>
        <button type="button" id="snapshots-button" class="btn ghost" popovertarget="snapshots-pop" title="Named versions of this project">
          Snapshots <span id="snapshots-count" class="badge"></span>
        </button>
        <span id="save-state" class="save-state" role="status" aria-live="polite"></span>
      </div>
      <span class="spacer"></span>
      <span id="conn" class="pill">server</span>
      <span id="out-pill" class="pill">output</span>
    </header>
    <div id="snapshots-pop" class="popover" popover></div>
    <div id="banners" role="status" aria-live="polite"></div>

    <section class="top-band" aria-label="Preview and data">
      <div class="preview-panel card">
        <div class="preview-toolbar">
          <span class="title">Preview</span>
          <label class="check" title="Show a live preview of the output (hiding it frees the GPU it uses)"
            ><input type="checkbox" id="preview-toggle" checked /> Live</label
          >
          <span class="edit-controls">
            <label class="check" title="Edit layer transforms and the 3D camera directly in the preview"
              ><input type="checkbox" id="edit-toggle" /> Edit</label
            >
            <span id="gizmo-modes" class="seg" role="group" aria-label="Gizmo mode"></span>
            <label class="snap-label" title="Snap: 10/50 px when moving, 5/15° when rotating, 0.05/0.25 when scaling"
              >Snap <select id="snap-select"></select
            ></label>
          </span>
        </div>
        <div id="preview-box">
          <div id="edit-badge"></div>
          <div id="preview-off" hidden>Preview off. It frees the GPU while the output keeps running.</div>
        </div>
      </div>

      <div class="data-tabs card">
        <div class="tablist" role="tablist" aria-label="Data and diagnostics">
          <button type="button" role="tab" id="tab-datasets" aria-controls="panel-datasets">Datasets <span id="badge-datasets" class="badge"></span></button>
          <button type="button" role="tab" id="tab-outputs" aria-controls="panel-outputs">Output windows <span id="badge-outputs" class="badge"></span></button>
          <button type="button" role="tab" id="tab-calibration" aria-controls="panel-calibration">Calibration</button>
          <button type="button" role="tab" id="tab-problems" aria-controls="panel-problems">Problems <span id="badge-problems" class="badge err"></span></button>
          <button type="button" role="tab" id="tab-log" aria-controls="panel-log">Log <span id="badge-log" class="badge warn"></span></button>
        </div>
        <div class="tabpanels">
          <div role="tabpanel" id="panel-datasets" aria-labelledby="tab-datasets" tabindex="0">
            <div class="ds-toolbar">
              <button type="button" id="import-button" class="btn primary">Import file…</button>
              <input id="import-file" type="file" accept=".csv,.tsv,.txt,.json" hidden />
              <span class="muted">CSV, TSV or JSON. Copied into the project unchanged.</span>
            </div>
            <div id="datasets"></div>
          </div>
          <div role="tabpanel" id="panel-outputs" aria-labelledby="tab-outputs" tabindex="0" hidden>
            <div id="outputs-body" class="muted">No output window connected.</div>
          </div>
          <div role="tabpanel" id="panel-calibration" aria-labelledby="tab-calibration" hidden>
            <div id="calibration"></div>
          </div>
          <div role="tabpanel" id="panel-problems" aria-labelledby="tab-problems" tabindex="0" hidden>
            <div id="problems" class="muted">None.</div>
          </div>
          <div role="tabpanel" id="panel-log" aria-labelledby="tab-log" hidden>
            <div id="log" tabindex="0" aria-label="Log"></div>
          </div>
        </div>
      </div>
    </section>

    <main class="workspace">
      <div class="side">
        <div class="zone" id="zone-show" aria-label="Scenes, timeline and modulation"></div>
        <div class="zone" id="zone-look" aria-label="Output and camera"></div>
      </div>
      <div class="zone" id="zone-layers" aria-label="Layers"></div>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
