<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>chromagraph control</title>
    <style>
      /* ---- tokens --------------------------------------------------------------------- */
      :root {
        color-scheme: dark;
        --font: system-ui, -apple-system, 'Segoe UI', Roboto, Ubuntu, Cantarell, sans-serif;
        --mono: ui-monospace, 'SF Mono', 'Cascadia Mono', 'Ubuntu Mono', Menlo, monospace;
        --bg: #0d0f13;
        --card: #161920;
        --card-head: #191d25;
        --raised: #1e232c;
        --field: #0f1217;
        --line: #252a34;
        --line-soft: rgba(255, 255, 255, 0.05);
        --text: #e3e6ec;
        --text-2: #b6bcc8;
        --muted: #7e8695;
        --accent: #8db4ff;
        --accent-strong: #6d9cff;
        --accent-weak: rgba(141, 180, 255, 0.14);
        --accent-ring: rgba(141, 180, 255, 0.55);
        --on-accent: #0c1220;
        --ok: #5fcb9b;
        --warn: #e8bb5e;
        --err: #f07c7c;
        --radius: 12px;
        --radius-s: 8px;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.35), 0 6px 20px rgba(0, 0, 0, 0.2);
        --gap: 12px;

        /* Tweakpane, themed to sit inside the cards. */
        --tp-base-background-color: transparent;
        --tp-base-shadow-color: transparent;
        --tp-base-border-radius: 0px;
        --tp-base-font-family: var(--font);
        --tp-blade-border-radius: 6px;
        --tp-blade-horizontal-padding: 6px;
        --tp-blade-value-width: 58%;
        --tp-container-horizontal-padding: 6px;
        --tp-container-vertical-padding: 6px;
        --tp-container-unit-size: 22px;
        --tp-container-unit-spacing: 6px;
        --tp-container-background-color: rgba(255, 255, 255, 0.035);
        --tp-container-background-color-hover: rgba(255, 255, 255, 0.06);
        --tp-container-background-color-focus: rgba(255, 255, 255, 0.08);
        --tp-container-background-color-active: rgba(255, 255, 255, 0.1);
        --tp-container-foreground-color: var(--text-2);
        --tp-input-background-color: rgba(0, 0, 0, 0.3);
        --tp-input-background-color-hover: rgba(0, 0, 0, 0.4);
        --tp-input-background-color-focus: rgba(0, 0, 0, 0.48);
        --tp-input-background-color-active: rgba(0, 0, 0, 0.52);
        --tp-input-foreground-color: var(--text);
        --tp-button-background-color: rgba(141, 180, 255, 0.16);
        --tp-button-background-color-hover: rgba(141, 180, 255, 0.24);
        --tp-button-background-color-focus: rgba(141, 180, 255, 0.28);
        --tp-button-background-color-active: rgba(141, 180, 255, 0.34);
        --tp-button-foreground-color: #dce7ff;
        --tp-label-foreground-color: var(--muted);
        --tp-groove-foreground-color: rgba(255, 255, 255, 0.09);
        --tp-monitor-background-color: rgba(0, 0, 0, 0.22);
        --tp-monitor-foreground-color: var(--text-2);
      }

      /* ---- base ----------------------------------------------------------------------- */
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
      }
      body {
        background: var(--bg);
        color: var(--text);
        font: 13px/1.45 var(--font);
        height: 100vh;
        overflow: hidden;
        display: grid;
        grid-template-rows: auto auto minmax(0, 1fr) auto;
      }
      [hidden] {
        display: none !important;
      }
      h1,
      h2,
      h3 {
        margin: 0;
        font-weight: 600;
      }
      .muted {
        color: var(--muted);
      }
      .small {
        font-size: 12px;
      }
      .warn {
        color: var(--warn);
      }
      .error {
        color: var(--err);
      }
      .spacer {
        flex: 1;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        overflow: hidden;
        clip-path: inset(50%);
        white-space: nowrap;
      }
      ::selection {
        background: var(--accent-weak);
      }
      /* Thin, quiet scrollbars. */
      * {
        scrollbar-width: thin;
        scrollbar-color: #2c323d transparent;
      }

      /* ---- form controls ------------------------------------------------------------------ */
      select,
      input,
      button {
        font: inherit;
        color: var(--text);
      }
      select,
      input[type='text'],
      input:not([type]) {
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        padding: 5px 8px;
        min-height: 30px;
      }
      select {
        padding-right: 6px;
      }
      /* Chrome paints the open dropdown list over white, so Tweakpane's translucent button
         colour came out pale blue with unreadable light text. Options get an opaque colour. */
      select option,
      select optgroup {
        background-color: var(--raised);
        color: var(--text);
      }
      input[type='checkbox'] {
        accent-color: var(--accent-strong);
        width: 15px;
        height: 15px;
        margin: 0;
        vertical-align: -2px;
      }
      input[type='range'] {
        accent-color: var(--accent-strong);
      }
      /* Plain buttons built by older panels (datasets, calibration) look like small .btn. */
      button:not([class]) {
        min-height: 28px;
        padding: 2px 10px;
        border-radius: var(--radius-s);
        border: 1px solid var(--line);
        background: var(--raised);
        cursor: pointer;
        font-size: 12px;
      }
      button:not([class]):hover {
        background: #252b36;
        border-color: #323946;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        min-height: 30px;
        padding: 4px 12px;
        border-radius: var(--radius-s);
        border: 1px solid var(--line);
        background: var(--raised);
        color: var(--text);
        cursor: pointer;
        white-space: nowrap;
        transition:
          background-color 0.12s,
          border-color 0.12s;
      }
      .btn:hover:not(:disabled) {
        background: #252b36;
        border-color: #323946;
      }
      .btn.primary {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
        color: var(--on-accent);
        font-weight: 600;
      }
      .btn.primary:hover:not(:disabled) {
        background: var(--accent);
        border-color: var(--accent);
      }
      .btn.ghost {
        background: transparent;
        border-color: transparent;
        color: var(--text-2);
      }
      .btn.ghost:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.05);
        border-color: transparent;
        color: var(--text);
      }
      .btn.small {
        min-height: 26px;
        padding: 2px 10px;
        font-size: 12px;
      }
      .btn.danger {
        color: var(--err);
      }
      .btn:disabled,
      .icon-btn:disabled {
        opacity: 0.4;
        cursor: default;
      }
      .icon-btn {
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        padding: 0;
        border: 0;
        border-radius: var(--radius-s);
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .icon-btn:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.07);
        color: var(--text);
      }
      .icon-btn.danger:hover:not(:disabled) {
        color: var(--err);
      }
      .icon {
        flex: none;
      }
      :focus-visible {
        outline: 2px solid var(--accent-ring);
        outline-offset: 2px;
      }
      select:focus-visible,
      input:focus-visible {
        outline-offset: 0;
        border-color: var(--accent);
      }
      .toolbar {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .toolbar.wrap {
        flex-wrap: wrap;
      }
      .toolbar.split > * {
        flex: 1;
      }
      label.check {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        user-select: none;
      }

      /* ---- pills and badges ------------------------------------------------------------------ */
      .pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: var(--text-2);
        font-size: 12px;
        white-space: nowrap;
      }
      /* The GPU name never wraps (a long one would push the whole window down): cut with "…"; the tooltip has it all. */
      #gpu-pill {
        display: inline-block;
        white-space: nowrap;
        max-width: 240px;
        overflow: hidden;
        text-overflow: ellipsis;
        flex-shrink: 1;
        min-width: 0;
      }
      #gpu-pill::before {
        display: inline-block;
        margin-right: 6px;
        vertical-align: middle;
      }

      .pill::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--muted);
      }
      .pill.ok::before {
        background: var(--ok);
      }
      .pill.warn::before {
        background: var(--warn);
      }
      .pill.err::before {
        background: var(--err);
      }
      .badge {
        display: inline-block;
        min-width: 18px;
        padding: 0 5px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.08);
        color: var(--text-2);
        font-size: 11px;
        line-height: 18px;
        text-align: center;
        font-variant-numeric: tabular-nums;
      }
      .badge:empty {
        display: none;
      }
      .badge.err {
        background: rgba(240, 124, 124, 0.2);
        color: #ffc4c4;
      }
      .badge.warn {
        background: rgba(232, 187, 94, 0.2);
        color: #ffe2a8;
      }

      /* ---- header ------------------------------------------------------------------------------ */
      .app-header {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 12px;
        padding: 10px 16px;
        border-bottom: 1px solid var(--line-soft);
        background: linear-gradient(#12151b, #101318);
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
        font-weight: 650;
        font-size: 14px;
        letter-spacing: 0.01em;
        margin-right: 8px;
      }
      .brand-mark {
        width: 18px;
        height: 18px;
        border-radius: 6px;
        background: conic-gradient(from 210deg, var(--accent-strong), #9ae6c8, var(--accent-strong));
        box-shadow: 0 0 12px rgba(141, 180, 255, 0.35);
      }
      .project-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px;
      }
      .project-bar select {
        min-width: 160px;
        max-width: 260px;
        font-weight: 600;
      }
      .divider {
        width: 1px;
        height: 20px;
        background: var(--line);
        margin: 0 4px;
      }
      .save-state {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 6px;
        color: var(--muted);
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        white-space: nowrap;
      }
      .save-state::before {
        content: '';
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: var(--ok);
      }
      .save-state.busy::before {
        background: var(--accent);
        animation: pulse 1.2s ease-in-out infinite;
      }
      .save-state.warn {
        color: var(--warn);
      }
      .save-state.warn::before {
        background: var(--warn);
      }
      @keyframes pulse {
        50% {
          opacity: 0.3;
        }
      }

      /* Snapshots menu (popover). */
      .popover {
        margin: 0;
        position: fixed;
        inset: auto;
        width: 420px;
        max-height: min(70vh, 560px);
        overflow: auto;
        padding: 16px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--text);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      }
      .popover-title {
        font-size: 14px;
        margin-bottom: 4px;
      }
      .popover > p {
        margin: 0 0 12px;
      }
      .snapshot-list {
        list-style: none;
        margin: 12px 0 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .snapshot {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: var(--radius-s);
        background: rgba(255, 255, 255, 0.03);
      }
      .snapshot-text {
        flex: 1;
        min-width: 0;
        display: flex;
        flex-direction: column;
      }
      .snapshot-label {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        font-weight: 550;
      }
      .snapshot-actions {
        display: flex;
        gap: 4px;
      }

      /* Name dialog. */
      .dialog {
        width: min(440px, calc(100vw - 32px));
        padding: 20px;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--text);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.55);
      }
      .dialog::backdrop {
        background: rgba(5, 6, 9, 0.6);
      }
      .dialog h2 {
        font-size: 15px;
        margin-bottom: 12px;
      }
      .dialog-field {
        display: flex;
        flex-direction: column;
        gap: 6px;
        color: var(--text-2);
      }
      .dialog-error {
        min-height: 20px;
        margin: 6px 0 0;
        color: var(--err);
        font-size: 12px;
      }
      .dialog-actions {
        display: flex;
        justify-content: flex-end;
        gap: 8px;
        margin-top: 8px;
      }

      /* ---- banners -------------------------------------------------------------------------------- */
      #banners {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding: 8px 16px 0;
      }
      #banners:empty {
        display: none;
      }
      .banner {
        padding: 8px 12px;
        border-radius: var(--radius-s);
        border: 1px solid transparent;
      }
      .banner.warn {
        background: rgba(232, 187, 94, 0.1);
        border-color: rgba(232, 187, 94, 0.25);
        color: #f6d999;
      }
      .banner.err {
        background: rgba(240, 124, 124, 0.1);
        border-color: rgba(240, 124, 124, 0.28);
        color: #ffb8b8;
      }
      .banner button {
        margin-left: 8px;
      }

      /* ---- cards ---------------------------------------------------------------------------------- */
      .card {
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        min-width: 0;
      }
      .card-head {
        display: flex;
        align-items: center;
        gap: 4px;
        padding: 6px 6px 6px 4px;
        border-radius: var(--radius) var(--radius) 0 0;
      }
      .card.collapsed .card-head {
        border-radius: var(--radius);
      }
      .card-toggle {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 4px 8px;
        border: 0;
        border-radius: var(--radius-s);
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .card-toggle:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .card-toggle .icon {
        color: var(--muted);
        transform: rotate(90deg);
        transition: transform 0.15s;
      }
      .card.collapsed .card-toggle .icon {
        transform: none;
      }
      .card-title {
        font-weight: 600;
        font-size: 13px;
        letter-spacing: 0.01em;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .card-note {
        color: var(--muted);
        font-size: 12px;
        white-space: nowrap;
      }
      .card-actions {
        display: flex;
        align-items: center;
        gap: 2px;
      }
      .card-body {
        padding: 2px 10px 12px;
      }
      .card-body > .tp-rotv,
      .scene-transition .tp-rotv {
        font-size: 12px;
      }
      .sub-head {
        margin: 14px 2px 4px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .empty-note {
        margin: 8px 2px;
      }

      /* Tweakpane inside cards: softer folders, readable labels. */
      .card .tp-rotv {
        box-shadow: none;
        font-weight: 450;
      }
      .card .tp-fldv_b {
        border-radius: 6px;
      }
      .card .tp-fldv_t {
        font-weight: 600;
        color: var(--text-2);
      }
      .card .tp-lblv_l {
        color: var(--muted);
      }
      .card .tp-btnv_b {
        border-radius: 6px;
        font-weight: 550;
      }

      /* ---- preview (top of the look column; both left columns in edit mode) ------------------------ */
      .preview-panel {
        display: flex;
        flex-direction: column;
        overflow: hidden;
        flex: none;
      }
      .preview-toolbar {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px 12px;
        min-height: 46px;
        padding: 8px 10px;
      }
      .preview-toolbar .title {
        font-weight: 600;
        margin-right: auto;
      }
      .edit-controls {
        display: inline-flex;
        align-items: center;
        gap: 8px;
      }
      body:not(.editing) #gizmo-modes,
      body:not(.editing) .snap-label {
        display: none;
      }
      .seg {
        display: inline-flex;
        padding: 2px;
        border-radius: var(--radius-s);
        background: var(--field);
        border: 1px solid var(--line);
      }
      .seg button {
        border: 0;
        background: transparent;
        color: var(--text-2);
        padding: 2px 8px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12px;
      }
      .seg button.active {
        background: var(--accent-weak);
        color: var(--accent);
      }
      .snap-label {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        color: var(--muted);
      }
      .snap-label select {
        min-height: 26px;
        padding: 2px 4px;
      }
      #preview-box {
        position: relative;
        flex: none;
        width: 100%;
        aspect-ratio: 16 / 9;
        background: #000;
        border-top: 1px solid var(--line-soft);
      }
      #preview-box iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        pointer-events: none;
      }
      #preview-off {
        position: absolute;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 16px;
        text-align: center;
        background: repeating-linear-gradient(135deg, #0f1115 0 12px, #12151a 12px 24px);
        color: var(--muted);
      }
      #edit-badge {
        position: absolute;
        left: 8px;
        top: 8px;
        z-index: 1;
        max-width: calc(100% - 16px);
        padding: 3px 10px;
        border-radius: 999px;
        background: rgba(10, 14, 22, 0.8);
        color: var(--accent);
        font-size: 12px;
        font-weight: 600;
        pointer-events: none;
        display: none;
      }
      body.editing #edit-badge {
        display: block;
      }
      /* Edit mode: a larger preview (see the workspace grid), with an accent ring. */
      body.editing .preview-panel {
        box-shadow:
          0 0 0 2px var(--accent-ring),
          var(--shadow);
      }
      body.editing #preview-box iframe {
        pointer-events: auto;
      }

      /* ---- project timeline strip (under the preview; see timeline-strip.ts) --------------------- */
      /* Transport above a full-width ruler; one row when the strip is wide (edit mode at 1080p). */
      .tstrip-host {
        container-type: inline-size;
        border-top: 1px solid var(--line-soft);
      }
      .tstrip {
        --tl-playhead: #f3f5f9;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        gap: 2px;
        padding: 6px 10px 8px;
      }
      .tstrip .tstrip-bar {
        min-height: 0;
        padding: 0;
        gap: 4px;
        min-width: 0;
      }
      .tstrip .tstrip-bar .icon-btn {
        width: 28px;
        height: 28px;
        flex: none;
      }
      .tstrip .tstrip-pos {
        font-size: 13px;
        margin-left: 6px;
      }
      .tstrip .tl-chip {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tstrip-ruler {
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.025);
        overflow: hidden;
      }
      .tstrip-ruler .tl-head-mark {
        bottom: 0;
      }
      @container (min-width: 720px) {
        .tstrip {
          grid-template-columns: auto minmax(0, 1fr);
          align-items: center;
          gap: 10px;
          padding: 6px 10px;
        }
      }

      /* ---- bottom drawer: Datasets, Output windows, Calibration, Diagnostics, Problems, Log ---------- */
      .drawer {
        grid-row: 4;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        margin: 0 16px 10px;
      }
      .drawer .tabpanels {
        height: var(--drawer-h, 38vh);
        flex: none;
      }
      .drawer:not(.open) .tabpanels,
      .drawer:not(.open) .drawer-handle {
        display: none;
      }
      /* Closed, no tab looks selected: the strip is a row of buttons that open the drawer. */
      .drawer:not(.open) .tablist [role='tab'][aria-selected='true'] {
        color: var(--muted);
        border-bottom-color: transparent;
      }
      .drawer:not(.open) .tablist {
        border-bottom-color: transparent;
      }
      .drawer-handle {
        height: 8px;
        margin-bottom: -4px;
        cursor: ns-resize;
        touch-action: none;
        position: relative;
        z-index: 1;
      }
      .drawer-handle::after {
        content: '';
        display: block;
        width: 40px;
        height: 3px;
        margin: 3px auto 0;
        border-radius: 2px;
        background: var(--line);
      }
      .drawer-handle:hover::after {
        background: var(--accent);
      }
      .drawer-toggle {
        align-self: center;
        display: inline-grid;
        place-items: center;
        width: 28px;
        height: 28px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .drawer-toggle:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.05);
      }
      .drawer.open .drawer-toggle svg {
        transform: rotate(180deg);
      }
      .tablist {
        display: flex;
        gap: 2px;
        padding: 6px 8px 0;
        border-bottom: 1px solid var(--line-soft);
        overflow-x: auto;
      }
      .tablist [role='tab'] {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 12px 9px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--muted);
        font-weight: 550;
        cursor: pointer;
        white-space: nowrap;
        border-radius: 6px 6px 0 0;
      }
      .tablist [role='tab']:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.03);
      }
      .tablist [role='tab']:focus-visible {
        outline-offset: -2px;
      }
      .tablist [role='tab'][aria-selected='true'] {
        color: var(--text);
        border-bottom-color: var(--accent);
      }
      .tabpanels {
        flex: 1;
        min-height: 0;
        position: relative;
      }
      [role='tabpanel'] {
        position: absolute;
        inset: 0;
        overflow: auto;
        padding: 12px 14px;
      }

      /* Datasets tab. */
      .ds-toolbar {
        display: flex;
        gap: 12px;
        align-items: center;
        margin-bottom: 10px;
      }
      #datasets {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(min(460px, 100%), 1fr));
        gap: 10px;
        align-items: start;
      }
      .dataset {
        border: 1px solid var(--line-soft);
        background: rgba(255, 255, 255, 0.02);
        border-radius: var(--radius-s);
        padding: 8px 10px;
        min-width: 0;
      }
      /* Row viewer in a dataset card (table-viewer.ts): only the rows in view are drawn. */
      .tv {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .tv-bar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        flex-wrap: wrap;
      }
      .tv-jump-label {
        display: flex;
        align-items: center;
        gap: 6px;
        font-size: 12px;
        color: var(--muted);
      }
      input.tv-jump {
        width: 90px;
        min-height: 26px;
        padding: 2px 6px;
      }
      .tv-scroll {
        height: 360px;
        min-height: 120px;
        resize: vertical;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        background: var(--field);
        font-family: var(--mono);
        font-size: 12px;
      }
      .tv-inner {
        position: relative;
        min-width: max-content;
      }
      .tv-row {
        display: grid;
        grid-template-columns: var(--tv-cols);
        height: 22px;
        line-height: 22px;
      }
      .tv-rows .tv-row:nth-child(even) {
        background: rgba(255, 255, 255, 0.025);
      }
      .tv-rows .tv-row:hover {
        background: rgba(255, 255, 255, 0.06);
      }
      .tv-row.tv-hit {
        background: var(--accent-weak);
        box-shadow: inset 2px 0 0 var(--accent);
      }
      .tv-head {
        position: sticky;
        top: 0;
        z-index: 1;
        background: var(--raised);
        border-bottom: 1px solid var(--line);
        font-family: var(--font);
        color: var(--text-2);
      }
      .tv-cell {
        padding: 0 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tv-right {
        text-align: right;
      }
      .tv-num {
        color: var(--muted);
        text-align: right;
        border-right: 1px solid var(--line-soft);
      }
      .tv-head .tv-num {
        cursor: pointer;
      }
      .tv-missing {
        color: var(--muted);
        opacity: 0.6;
      }
      button.tv-sort {
        all: unset;
        box-sizing: border-box;
        padding: 0 8px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        cursor: pointer;
        font-weight: 500;
      }
      button.tv-sort.tv-right {
        text-align: right;
      }
      button.tv-sort:hover {
        color: var(--text);
      }
      button.tv-sort:focus-visible {
        outline: 2px solid var(--accent-ring);
        outline-offset: -2px;
      }
      button.tv-sort[data-sort='asc']::after {
        content: ' ↑';
        color: var(--accent);
      }
      button.tv-sort[data-sort='desc']::after {
        content: ' ↓';
        color: var(--accent);
      }
      button.link-btn {
        all: unset;
        cursor: pointer;
        color: var(--accent);
        text-decoration: underline;
        text-underline-offset: 2px;
        font-size: 12px;
      }
      button.link-btn:focus-visible {
        outline: 2px solid var(--accent-ring);
      }

      .ds-head {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .ds-head select {
        max-width: 200px;
      }
      .ds-credits {
        display: grid;
        grid-template-columns: auto minmax(0, 1fr);
        gap: 4px 8px;
        align-items: center;
        margin-bottom: 6px;
      }
      .ds-credits label {
        color: var(--muted);
        font-size: 12px;
      }
      .ds-credits input {
        width: 100%;
        min-width: 0;
      }
      .ds-body {
        overflow-x: auto;
      }
      table.cols {
        border-collapse: collapse;
        width: 100%;
        margin-top: 4px;
        font-variant-numeric: tabular-nums;
        font-size: 12px;
      }
      table.cols th,
      table.cols td {
        text-align: left;
        padding: 3px 10px 3px 0;
        border-bottom: 1px solid var(--line-soft);
        vertical-align: top;
      }
      table.cols th {
        color: var(--muted);
        font-weight: 500;
      }
      ul.issues {
        margin: 6px 0 0;
        padding-left: 18px;
      }

      /* Output windows tab. */
      #outputs-body table {
        border-collapse: collapse;
        width: 100%;
        font-variant-numeric: tabular-nums;
      }
      #outputs-body td,
      #outputs-body th {
        text-align: left;
        padding: 4px 12px 4px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      #outputs-body th {
        color: var(--muted);
        font-weight: 500;
      }

      /* Calibration tab: controls on the left, the corner editor sized to the panel height. */
      #calibration {
        display: grid;
        grid-template-columns: minmax(240px, 1fr) auto;
        grid-template-rows: auto 1fr;
        gap: 8px 16px;
        height: 100%;
      }
      .calib-toolbar {
        grid-column: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        align-content: start;
      }
      .calib-readout {
        grid-column: 1;
        grid-row: 2;
        font-size: 12px;
      }
      .calib-svg {
        grid-column: 2;
        grid-row: 1 / span 2;
        display: block;
        height: 100%;
        max-height: 100%;
        width: auto;
        max-width: 100%;
        aspect-ratio: 1.24 / 0.8025;
        background: #0a0b0e;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        touch-action: none;
        outline: none;
      }
      .calib-svg:focus-visible {
        border-color: var(--accent);
      }
      .calib-window {
        fill: none;
        stroke: var(--muted);
        stroke-width: 0.004;
        stroke-dasharray: 0.015 0.01;
      }
      .calib-quad {
        fill: rgba(141, 180, 255, 0.12);
        stroke: var(--accent);
        stroke-width: 0.004;
      }
      .calib-handle {
        cursor: grab;
      }

      /* Problems and log tabs. */
      #problems > div {
        padding: 6px 0;
        border-bottom: 1px solid var(--line-soft);
      }
      #panel-log {
        padding: 0;
      }
      /* Tweakpane checkboxes: the dark box alone all but vanished on the cards, so it gets a grey
         border (accent when ticked). Their labels toggle them too (main.ts), so say so. */
      .tp-ckbv_w {
        box-shadow: inset 0 0 0 1.5px var(--muted);
      }
      .tp-ckbv_i:checked + .tp-ckbv_w {
        box-shadow: inset 0 0 0 1.5px var(--accent-strong);
      }
      .tp-ckbv_l:hover .tp-ckbv_w {
        box-shadow: inset 0 0 0 1.5px var(--text-2);
      }
      .tp-lblv:has(.tp-ckbv) > .tp-lblv_l {
        cursor: pointer;
      }
      /* ---- About box (ABOUT.md) ---------------------------------------------------------------- */
      .about-btn {
        margin-left: -6px;
        color: var(--muted);
      }
      .out-btn.primary {
        color: var(--accent);
      }
      .about-dialog {
        width: min(760px, calc(100vw - 32px));
        max-height: min(80vh, 900px);
        padding: 0;
        border: 1px solid var(--line);
        border-radius: var(--radius);
        background: var(--card);
        color: var(--text);
        box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      }
      .about-dialog::backdrop {
        background: rgba(5, 7, 10, 0.6);
      }
      .about-dialog[open] {
        display: flex;
        flex-direction: column;
      }
      .about-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 14px 16px;
        border-bottom: 1px solid var(--line-soft);
      }
      .about-head h1 {
        flex: 1;
        font-size: 16px;
      }
      .about-body {
        overflow: auto;
        padding: 8px 20px 20px;
        line-height: 1.6;
        color: var(--text-2);
      }
      .about-body h2,
      .about-body h3,
      .about-body h4,
      .about-body h5 {
        color: var(--text);
        margin: 18px 0 6px;
      }
      .about-body code {
        font-family: var(--mono);
        font-size: 12px;
        background: var(--field);
        padding: 1px 4px;
        border-radius: 4px;
      }
      .about-body pre {
        background: var(--field);
        padding: 10px 12px;
        border-radius: var(--radius-s);
        overflow: auto;
      }
      .about-body pre code {
        background: none;
        padding: 0;
      }
      .about-body a {
        color: var(--accent);
      }
      .about-body blockquote {
        margin: 8px 0;
        padding-left: 12px;
        border-left: 3px solid var(--line);
      }
      .problem-row {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 3px 0;
        font-family: var(--mono);
        font-size: 12px;
      }
      .problem-row.summary {
        font-family: inherit;
      }
      .diagnostics {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .diagnostics label {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
      }
      #log {
        height: 100%;
        overflow: auto;
        font: 12px/1.5 var(--mono);
        padding: 8px 14px;
      }
      #log div {
        white-space: pre-wrap;
        word-break: break-word;
      }
      #log .warn {
        color: var(--warn);
      }
      #log .error {
        color: var(--err);
      }
      #log .time {
        color: var(--muted);
      }

      /* ---- workspace: columns of cards ------------------------------------------------------------- */
      /*
       * Wide: [preview / camera] [right zone x2, in tabs: Scene, Datasets, Layers, Timeline]. The
       * right zone runs the full height from the header to the drawer; each zone scrolls on its
       * own. In edit mode the left column widens for a bigger preview.
       */
      .workspace {
        /* Body rows are header, banners, workspace, drawer; placed explicitly, since an empty banner bar is display: none. */
        grid-row: 3;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(0, 2fr);
        grid-template-rows: auto minmax(0, 1fr);
        gap: var(--gap);
        padding: var(--gap) 16px var(--gap);
        min-height: 0;
      }
      .side {
        display: contents;
      }
      .workspace .preview-panel {
        grid-column: 1;
        grid-row: 1;
      }
      #zone-look {
        grid-column: 1;
        grid-row: 2;
      }
      #zone-layers {
        grid-column: 2;
        grid-row: 1 / span 2;
      }
      body.editing .workspace {
        grid-template-columns: minmax(0, 1.6fr) minmax(0, 2fr);
      }
      /*
       * Scene tab: its cards (Scenes, Timeline, Output, Calibration) flow down columns at least
       * 400 px wide, so a short card never leaves a gap under it.
       */
      #zone-layers > #panel-scene {
        display: block;
        columns: 400px;
        column-gap: var(--gap);
      }
      #panel-scene > .card {
        break-inside: avoid;
        margin-bottom: var(--gap);
      }
      /* Datasets tab: as the dataset list was laid out in the drawer. */
      #zone-layers > #panel-data {
        gap: 10px;
      }
      .zone {
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        min-height: 0;
        overflow-y: auto;
        padding: 2px 4px 24px 2px;
        scrollbar-gutter: stable;
      }
      .zone-head {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 2px 0 4px;
        min-height: 34px;
      }
      .zone-title {
        font-size: 15px;
        letter-spacing: 0.01em;
      }
      .zone-note {
        color: var(--muted);
      }
      .empty-card {
        padding: 16px;
      }
      .empty-card p {
        margin: 0;
      }

      /*
       * Layers tab: a narrow list of layers on the left (Add layer first), the open layer's
       * settings on the right. Each column scrolls on its own; under 720 px the list sits above
       * the settings and the two scroll together.
       */
      #zone-layers > #panel-layers {
        container: layers / inline-size;
        overflow: hidden;
        padding: 0;
      }
      .layers-split {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: 300px minmax(0, 1fr);
        gap: var(--gap);
      }
      .layers-list-col,
      .layers-settings-col {
        min-height: 0;
        min-width: 0;
        overflow-y: auto;
        scrollbar-gutter: stable;
        padding: 2px 4px 24px 2px;
      }
      .layers-list-col {
        display: flex;
        flex-direction: column;
      }
      .layers-list-col > .sub-head:first-child {
        margin-top: 2px;
      }
      .layer-add {
        display: flex;
        gap: 6px;
      }
      .layer-add .choice-menu {
        flex: 1;
        min-width: 0;
      }

      /* Dropdown with a description under each option (choice-menu.ts). */
      .choice-button {
        display: flex;
        align-items: center;
        gap: 6px;
        width: 100%;
        min-height: 30px;
        padding: 5px 6px 5px 8px;
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        text-align: left;
        cursor: pointer;
      }
      .choice-button:hover {
        border-color: #343a46;
      }
      .choice-button:focus-visible {
        outline-offset: 0;
        border-color: var(--accent);
      }
      .choice-button-label {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .choice-button .icon {
        flex: none;
        color: var(--muted);
        transform: rotate(90deg);
      }
      .choice-pop {
        margin: 0;
        position: fixed;
        inset: auto;
        overflow: auto;
        padding: 4px;
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        background: var(--raised);
        color: var(--text);
        box-shadow: 0 16px 48px rgba(0, 0, 0, 0.5);
      }
      .choice-option {
        display: flex;
        flex-direction: column;
        gap: 2px;
        padding: 6px 10px 7px;
        border-radius: 6px;
        cursor: pointer;
      }
      .choice-option:focus {
        outline: none;
        background: rgba(255, 255, 255, 0.06);
      }
      .choice-option:focus-visible {
        outline: 2px solid var(--accent-ring);
        outline-offset: -2px;
      }
      .choice-option[aria-selected='true'] {
        background: var(--accent-weak);
      }
      .choice-option[aria-selected='true'] .choice-name {
        color: var(--accent);
      }
      .choice-name {
        font-weight: 500;
      }
      .choice-desc {
        font-size: 12px;
        line-height: 1.35;
        color: var(--muted);
      }
      .layer-list {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      @container layers (max-width: 719px) {
        .layers-split {
          display: block;
          overflow-y: auto;
          padding: 2px 4px 24px 2px;
        }
        .layers-list-col,
        .layers-settings-col {
          overflow: visible;
          padding: 0;
        }
        .layers-list-col {
          margin-bottom: var(--gap);
        }
      }

      /* A layer's row, drawn like a collapsed card header: number badge, title, icon buttons. */
      .layer-row {
        display: flex;
        align-items: center;
        gap: 2px;
        padding: 3px 4px 3px 2px;
        background: var(--card-head);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        cursor: pointer;
      }
      .layer-row:hover {
        background: #1e232c;
      }
      .layer-row .layer-row-open {
        padding: 5px 6px;
      }
      .layer-row .layer-row-open:hover {
        background: transparent;
      }
      .layer-row .card-actions {
        gap: 0;
      }
      .layer-row .icon-btn {
        width: 24px;
        height: 24px;
      }
      .layer-row.open {
        border-color: rgba(141, 180, 255, 0.45);
        background: linear-gradient(90deg, rgba(141, 180, 255, 0.14), rgba(141, 180, 255, 0.04)), var(--card-head);
        box-shadow:
          0 0 0 1px rgba(141, 180, 255, 0.35),
          var(--shadow);
      }
      .layer-row.open .card-badge,
      .layer-settings .card-badge {
        background: var(--accent-strong);
        color: var(--on-accent);
      }

      /* The open layer's settings: a card whose header stays in view while its folders scroll. */
      .layer-card .card-head {
        background: var(--card-head);
      }
      .layer-settings > .card-head {
        position: sticky;
        top: 0;
        z-index: 2;
        gap: 8px;
        padding: 10px 12px;
      }
      .layer-settings .card-title {
        margin: 0;
      }
      .layer-pane > .tp-rotv {
        font-size: 12px;
      }
      .card-badge:empty {
        display: none;
      }
      .card-badge {
        display: inline-grid;
        place-items: center;
        min-width: 20px;
        height: 20px;
        padding: 0 5px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text-2);
        font-size: 11px;
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .layer-row.off .card-title,
      .layer-card.off .card-title {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: rgba(255, 255, 255, 0.25);
      }

      /* ---- right zone tabs: Layers | Timeline ------------------------------------------------------------ */
      /* The zone itself no longer scrolls: its tab strip stays put and each panel scrolls on its own. */
      #zone-layers {
        overflow: hidden;
        padding: 0;
        gap: 0;
      }
      .zone-tabs {
        flex: none;
        padding: 0 4px;
        margin-bottom: 8px;
      }
      #zone-layers > .zone-panel {
        position: static;
        inset: auto;
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        display: flex;
        flex-direction: column;
        gap: var(--gap);
        padding: 2px 4px 24px 2px;
        scrollbar-gutter: stable;
      }
      #panel-timeline {
        padding-top: 0;
      }

      /* ---- timeline tab ------------------------------------------------------------------------------- */
      .tl-root {
        --tl-keys: #8db4ff;
        --tl-ramp: #6fd6b0;
        --tl-lfo: #e8bb5e;
        --tl-noise: #c79bff;
        --tl-playhead: #f3f5f9;
        container-type: inline-size;
        display: flex;
        flex-direction: column;
        gap: 10px;
        min-width: 0;
      }
      .tl-header {
        --tl-label-w: 184px;
        position: sticky;
        top: 0;
        z-index: 4;
        background: var(--bg);
        padding: 2px 0 6px;
        box-shadow: 0 8px 12px -10px rgba(0, 0, 0, 0.8);
      }
      .tl-transport {
        display: flex;
        align-items: center;
        gap: 6px;
        min-height: 34px;
        padding: 0 2px 6px;
      }
      .tl-transport .icon-btn {
        width: 32px;
        height: 32px;
        background: var(--raised);
        color: var(--text);
        border: 1px solid var(--line);
      }
      .tl-transport .icon-btn.tl-play {
        background: var(--accent-strong);
        border-color: var(--accent-strong);
        color: var(--on-accent);
      }
      .tl-transport .icon-btn.tl-play:hover {
        background: var(--accent);
        color: var(--on-accent);
      }
      .tl-pos {
        font-variant-numeric: tabular-nums;
        font-weight: 600;
        font-size: 14px;
        margin-left: 6px;
        white-space: nowrap;
      }
      .tl-pos.small {
        font-size: 12px;
        font-weight: 500;
        color: var(--text-2);
        margin-left: 0;
      }
      .tl-chip {
        padding: 1px 8px;
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.06);
        color: var(--text-2);
        font-size: 12px;
        white-space: nowrap;
      }
      .tl-hint {
        color: var(--muted);
        font-size: 11.5px;
        text-align: right;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      /* A row: label column, then the track (whose x is the phase 0..1 of the driving timeline). */
      .tl-row {
        display: grid;
        grid-template-columns: var(--tl-label-w) minmax(0, 1fr);
        align-items: stretch;
      }
      .tl-label {
        display: flex;
        flex-direction: column;
        justify-content: center;
        gap: 1px;
        min-width: 0;
        padding: 4px 8px 4px 12px;
        border-right: 1px solid var(--line-soft);
      }
      .tl-master .tl-label {
        flex-direction: row;
        align-items: baseline;
        justify-content: flex-start;
        gap: 8px;
        border-right-color: transparent;
      }
      .tl-name {
        font-weight: 600;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tl-sub {
        color: var(--muted);
        font-size: 11.5px;
        font-variant-numeric: tabular-nums;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tl-sub.selected {
        color: var(--text);
      }
      .tl-track {
        position: relative;
        min-width: 0;
      }
      .tl-track canvas {
        display: block;
      }
      .tl-ruler {
        height: 26px;
        cursor: ew-resize;
        touch-action: none;
        user-select: none;
      }
      .tl-master .tl-ruler {
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.025);
      }
      .tl-ruler:hover {
        background: rgba(255, 255, 255, 0.045);
      }
      /* Playhead on a ruler: a handle and a short line (the lanes have their own line). */
      .tl-head-mark {
        position: absolute;
        top: 0;
        bottom: -6px;
        left: -1px;
        width: 2px;
        background: var(--tl-playhead);
        pointer-events: none;
        will-change: transform;
      }
      .tl-head-mark::before {
        content: '';
        position: absolute;
        top: 0;
        left: -5px;
        width: 12px;
        height: 9px;
        background: var(--tl-playhead);
        clip-path: polygon(0 0, 100% 0, 50% 100%);
      }
      .tl-subruler .tl-head-mark,
      .tl-subruler .tl-head-mark::before {
        background: var(--accent);
      }
      .tl-groups {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .tl-empty {
        margin: 8px 4px;
      }
      .tl-group {
        --tl-label-w: 184px;
        background: var(--card);
        border: 1px solid var(--line-soft);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .tl-group.own {
        border-color: rgba(141, 180, 255, 0.22);
      }
      .tl-group.selected {
        border-color: rgba(141, 180, 255, 0.45);
        box-shadow:
          0 0 0 1px rgba(141, 180, 255, 0.35),
          var(--shadow);
      }
      .tl-ghead {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 4px 6px;
        padding: 5px 8px 5px 4px;
        background: var(--card-head);
        min-height: 40px;
      }
      .tl-group.selected .tl-ghead {
        background: linear-gradient(90deg, rgba(141, 180, 255, 0.14), rgba(141, 180, 255, 0.04));
      }
      .tl-group.selected .card-badge {
        background: var(--accent-strong);
        color: var(--on-accent);
      }
      .tl-fold {
        display: inline-grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        color: var(--muted);
        cursor: pointer;
      }
      .tl-fold:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.06);
      }
      .tl-fold svg {
        transform: rotate(90deg);
        transition: transform 0.12s;
      }
      .tl-group.collapsed .tl-fold svg {
        transform: none;
      }
      .tl-group.collapsed .tl-gbody {
        display: none;
      }
      .tl-gname {
        border: 0;
        background: transparent;
        padding: 2px 4px;
        border-radius: 6px;
        font-weight: 600;
        font-size: 13.5px;
        cursor: pointer;
        max-width: 22ch;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .tl-gname:hover:not(:disabled) {
        background: rgba(255, 255, 255, 0.06);
        text-decoration: underline;
        text-decoration-color: var(--muted);
        text-underline-offset: 3px;
      }
      .tl-gname:disabled {
        cursor: default;
        color: var(--text);
      }
      .tl-group.off .tl-gname {
        color: var(--muted);
        text-decoration: line-through;
        text-decoration-color: rgba(255, 255, 255, 0.25);
      }
      .tl-type {
        color: var(--muted);
        font-size: 12px;
      }
      .tl-type:empty {
        display: none;
      }
      .tl-tag {
        padding: 1px 8px;
        border-radius: 999px;
        font-size: 11.5px;
        color: var(--muted);
        background: rgba(255, 255, 255, 0.04);
        white-space: nowrap;
      }
      .tl-tag.own {
        color: #cfe0ff;
        background: var(--accent-weak);
        box-shadow: inset 0 0 0 1px rgba(141, 180, 255, 0.3);
      }
      /* On a layer the tag opens its timeline editor. */
      button.tl-tag {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 0;
        font-size: 11.5px;
        line-height: 18px;
        cursor: pointer;
      }
      button.tl-tag::after {
        content: '';
        width: 5px;
        height: 5px;
        border-right: 1.5px solid currentColor;
        border-bottom: 1.5px solid currentColor;
        transform: translateY(-2px) rotate(45deg);
        opacity: 0.75;
      }
      button.tl-tag[aria-expanded='true']::after {
        transform: translateY(1px) rotate(-135deg);
      }
      button.tl-tag:hover {
        color: var(--text);
        background: rgba(255, 255, 255, 0.08);
      }
      button.tl-tag.own:hover {
        color: #e3edff;
        background: rgba(141, 180, 255, 0.22);
      }
      button.tl-tag[aria-expanded='true'] {
        box-shadow: inset 0 0 0 1px var(--accent-ring);
      }
      /* A layer's timeline editor, under its header: label column, then controls. */
      .tl-ed {
        display: grid;
        grid-template-columns: max-content minmax(0, 1fr);
        align-items: center;
        gap: 8px 14px;
        padding: 10px 10px 12px 40px;
        border-top: 1px solid var(--line-soft);
        background: rgba(141, 180, 255, 0.035);
        font-size: 12px;
      }
      .tl-ed-label {
        color: var(--muted);
        font-size: 11.5px;
      }
      .tl-ed-ctl {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 6px 8px;
        min-width: 0;
      }
      .tl-ed .seg button {
        padding: 3px 10px;
      }
      .tl-ed-note {
        grid-column: 2;
        margin: 0;
        max-width: 64ch;
        color: var(--muted);
        font-size: 12px;
        line-height: 1.45;
      }
      .tl-ed-dur {
        width: 92px;
        min-height: 26px;
        padding: 2px 6px;
        background: var(--field);
        border: 1px solid var(--line);
        border-radius: var(--radius-s);
        font-variant-numeric: tabular-nums;
      }
      .tl-ed-quick {
        display: inline-flex;
        gap: 4px;
        margin-left: 6px;
      }
      .tl-ed-quick .btn.active {
        color: var(--accent);
        background: var(--accent-weak);
        border-color: rgba(141, 180, 255, 0.35);
      }
      .tl-ed-check {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 8px;
        color: var(--text-2);
        cursor: pointer;
      }
      .tl-ed-close.icon-btn:hover,
      .tl-ed-close.icon-btn:focus-visible {
        opacity: 1;
      }
      /* Lane range switch in the transport row. */
      .tl-scale {
        flex: none;
        display: inline-flex;
        align-items: center;
        gap: 6px;
        margin-left: 8px;
      }
      .tl-scale .tl-sub {
        overflow: visible;
      }
      .tl-scale .seg button,
      .tl-ed .seg button {
        white-space: nowrap;
      }
      .tl-ghead .icon-btn {
        width: 26px;
        height: 26px;
      }
      .tl-ghead .icon-btn.tl-play {
        color: var(--accent);
      }
      .tl-add {
        min-height: 26px;
        padding: 2px 6px;
        font-size: 12px;
        max-width: 150px;
        color: var(--text-2);
      }
      .tl-gbody {
        position: relative;
        border-top: 1px solid var(--line-soft);
      }
      .tl-subruler {
        background: rgba(141, 180, 255, 0.04);
        border-bottom: 1px solid var(--line-soft);
      }
      .tl-subruler .tl-label {
        padding-top: 0;
        padding-bottom: 0;
      }
      .tl-none {
        margin: 0;
        padding: 10px 12px;
        font-size: 12px;
      }
      .tl-lane + .tl-lane {
        border-top: 1px solid var(--line-soft);
      }
      .tl-lrow {
        display: flex;
        align-items: center;
        gap: 6px;
        min-width: 0;
      }
      .tl-kind {
        flex: none;
        padding: 0 6px;
        border-radius: 999px;
        font-size: 10.5px;
        line-height: 16px;
        font-weight: 600;
        letter-spacing: 0.02em;
        color: var(--tl-keys);
        background: rgba(141, 180, 255, 0.12);
      }
      .tl-kind.ramp {
        color: var(--tl-ramp);
        background: rgba(111, 214, 176, 0.12);
      }
      .tl-kind.lfo {
        color: var(--tl-lfo);
        background: rgba(232, 187, 94, 0.12);
      }
      .tl-kind.noise {
        color: var(--tl-noise);
        background: rgba(199, 155, 255, 0.12);
      }
      .tl-value {
        flex: none;
        min-width: 38px;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
        color: var(--text);
      }
      .tl-mini.icon-btn {
        flex: none;
        width: 22px;
        height: 22px;
        opacity: 0.55;
      }
      .tl-lane:hover .tl-mini.icon-btn:not(:disabled),
      .tl-mini.icon-btn:focus-visible {
        opacity: 1;
      }
      .tl-mini.icon-btn:disabled {
        opacity: 0.2;
      }
      .tl-lane.disabled .tl-name {
        color: var(--muted);
      }
      .tl-lane canvas {
        outline: none;
        touch-action: none;
        cursor: crosshair;
      }
      .tl-lane canvas:focus-visible {
        box-shadow: inset 0 0 0 1px rgba(141, 180, 255, 0.28);
      }
      .tl-lane canvas.dragging {
        cursor: grabbing !important;
      }
      /* Live value at the playhead. */
      .tl-dot {
        position: absolute;
        top: -4px;
        left: -4px;
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: var(--tl-playhead);
        box-shadow: 0 0 0 2px var(--card);
        pointer-events: none;
        will-change: transform;
      }
      /* LFO and noise run on the wall clock, not the timeline: hatched, and they cover the playhead line. */
      .tl-lane.wave {
        position: relative;
        z-index: 2;
        background: var(--card);
      }
      .tl-lane.wave .tl-track {
        background: repeating-linear-gradient(135deg, rgba(255, 255, 255, 0.028) 0 6px, transparent 6px 12px);
      }
      .tl-lane.wave canvas {
        cursor: default;
      }
      .tl-free {
        position: absolute;
        top: 3px;
        left: 8px;
        padding: 0 6px;
        border-radius: 4px;
        background: rgba(13, 15, 19, 0.75);
        color: var(--muted);
        font-size: 10.5px;
        line-height: 15px;
        pointer-events: none;
      }
      /* The playhead line over a group's lanes. */
      .tl-line {
        position: absolute;
        top: 0;
        bottom: 0;
        left: -1px;
        width: 2px;
        background: var(--tl-playhead);
        opacity: 0.55;
        z-index: 1;
        pointer-events: none;
        will-change: transform;
      }
      .tl-group.own .tl-line {
        background: var(--accent);
        opacity: 0.8;
      }
      /* Narrow: a slimmer label column, where the kind chip becomes a coloured dot. */
      @container (max-width: 620px) {
        .tl-header,
        .tl-group {
          --tl-label-w: 148px;
        }
        .tl-hint,
        .tl-type {
          display: none;
        }
        .tl-label {
          padding-left: 8px;
          padding-right: 4px;
        }
        .tl-kind {
          width: 7px;
          height: 7px;
          padding: 0;
          font-size: 0;
          line-height: 0;
          background: currentColor;
        }
        .tl-kind.ramp,
        .tl-kind.lfo,
        .tl-kind.noise {
          background: currentColor;
        }
        .tl-lrow {
          gap: 4px;
        }
        .tl-ed {
          padding-left: 12px;
          column-gap: 10px;
        }
        .tl-ed-quick,
        .tl-ed-check {
          margin-left: 0;
        }
      }

      /* ---- scenes ------------------------------------------------------------------------------------ */
      .scene-list {
        list-style: none;
        margin: 10px 0 8px;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .scene-row {
        position: relative;
        border-radius: var(--radius-s);
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid transparent;
        overflow: hidden;
      }
      .scene-row.active {
        background: var(--accent-weak);
        border-color: rgba(141, 180, 255, 0.4);
      }
      .scene-main {
        display: flex;
        align-items: center;
        gap: 2px;
        padding-right: 4px;
      }
      .scene-go {
        flex: 1;
        min-width: 0;
        display: grid;
        grid-template-columns: auto minmax(0, 1fr) auto;
        grid-template-rows: auto auto;
        column-gap: 10px;
        align-items: center;
        padding: 7px 10px;
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
        border-radius: var(--radius-s);
      }
      .scene-go:hover {
        background: rgba(255, 255, 255, 0.04);
      }
      .scene-num {
        grid-row: 1 / span 2;
        display: grid;
        place-items: center;
        width: 26px;
        height: 26px;
        border-radius: 7px;
        background: rgba(255, 255, 255, 0.07);
        color: var(--text-2);
        font-weight: 650;
        font-variant-numeric: tabular-nums;
      }
      .scene-row.active .scene-num {
        background: var(--accent-strong);
        color: var(--on-accent);
      }
      .scene-name {
        font-weight: 600;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .scene-edited {
        display: none;
        font-size: 11px;
        color: var(--warn);
        padding: 0 6px;
        border-radius: 999px;
        background: rgba(232, 187, 94, 0.12);
      }
      .scene-row.edited .scene-edited {
        display: inline-block;
      }
      .scene-meta {
        grid-column: 2 / span 2;
        color: var(--muted);
        font-size: 12px;
      }
      .scene-progress {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        height: 2px;
        opacity: 0;
      }
      .scene-row.morphing .scene-progress {
        opacity: 1;
      }
      .scene-bar {
        display: block;
        height: 100%;
        background: var(--accent);
        transform-origin: left;
        transform: scaleX(1);
      }
      .scene-detail {
        display: flex;
        flex-direction: column;
        gap: 8px;
        padding: 8px 10px 12px;
        border-top: 1px solid var(--line-soft);
      }
      .range-row {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .range-row input[type='range'] {
        flex: 1;
        min-width: 80px;
      }
      .range-row output {
        width: 44px;
        text-align: right;
        font-variant-numeric: tabular-nums;
        color: var(--text-2);
      }
      .scene-transition {
        margin: 0 -4px;
      }

      /* ---- responsive --------------------------------------------------------------------------------- */
      /* Medium (about 1100–1500 px): two columns; show + look stacked on the left, layers on the right. */
      @media (max-width: 1499px) {
        .workspace,
        body.editing .workspace {
          grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr);
          grid-template-rows: minmax(0, 1fr);
        }
        #zone-layers {
          grid-column: 2;
          grid-row: 1;
        }
        .side {
          display: flex;
          flex-direction: column;
          gap: var(--gap);
          min-height: 0;
          overflow-y: auto;
          padding: 2px 4px 24px 2px;
          scrollbar-gutter: stable;
        }
        .side > .zone {
          overflow: visible;
          padding: 0;
          flex: none;
        }
      }
      /* Narrow or short: one column and the page scrolls as a whole. */
      @media (max-width: 1099px), (max-height: 640px) {
        body {
          height: auto;
          overflow: visible;
          display: block;
        }
        .workspace {
          display: flex;
          flex-direction: column;
        }
        .drawer {
          position: sticky;
          bottom: 0;
          z-index: 2;
          box-shadow: var(--shadow);
        }
        .side,
        .zone {
          overflow: visible;
          padding: 0;
        }
        #zone-layers,
        #zone-layers > .zone-panel {
          overflow: visible;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation: none !important;
          transition: none !important;
          scroll-behavior: auto !important;
        }
        .scene-bar {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="app-header">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>chromagraph</div>
      <button type="button" id="about-button" class="icon-btn about-btn" title="About (ABOUT.md)" aria-label="About" aria-haspopup="dialog"></button>
      <div class="project-bar" role="group" aria-label="Project">
        <select id="project-select" aria-label="Open project"></select>
        <button type="button" id="project-new" class="btn ghost" title="Create an empty project">New…</button>
        <span class="divider" aria-hidden="true"></span>
        <button type="button" id="save-button" class="btn" title="Write the project to disk now (it also saves automatically)">Save</button>
        <button type="button" id="save-as-button" class="btn ghost" title="Copy this project and its data to a new name, then open the copy">Save as…</button>
        <button type="button" id="snapshots-button" class="btn ghost" popovertarget="snapshots-pop" title="Named versions of this project">
          Snapshots <span id="snapshots-count" class="badge"></span>
        </button>
        <span id="save-state" class="save-state" role="status" aria-live="polite"></span>
      </div>
      <span class="spacer"></span>
      <div class="project-bar" role="group" aria-label="Output window">
        <span class="muted small">Output</span>
        <button type="button" id="output-window" class="icon-btn out-btn" title="Output in a window you can move (F11 for full screen)" aria-label="Output in a window"></button>
        <button type="button" id="output-projector" class="icon-btn out-btn primary" title="Output full screen on the projector, on the NVIDIA GPU (closes and reopens it if it is already open)" aria-label="Output on the projector"></button>
        <button type="button" id="output-close" class="icon-btn out-btn" title="Close the output window opened with these buttons" aria-label="Close the output window"></button>
      </div>
      <span class="divider" aria-hidden="true"></span>
      <span id="conn" class="pill">server</span>
      <span id="out-pill" class="pill">output</span>
      <span id="gpu-pill" class="pill" title="The GPU the output window renders on">GPU</span>
    </header>
    <div id="snapshots-pop" class="popover" popover></div>
    <dialog id="about-dialog" class="about-dialog" aria-labelledby="about-title">
      <header class="about-head">
        <h1 id="about-title">About chromagraph</h1>
        <button type="button" id="about-close" class="icon-btn" title="Close (Esc)" aria-label="Close"></button>
      </header>
      <div id="about-body" class="about-body"></div>
    </dialog>
    <div id="banners" role="status" aria-live="polite"></div>

    <main class="workspace">
      <div class="side">
        <div class="preview-panel card">
          <div class="preview-toolbar">
            <span class="title">Preview</span>
            <label class="check" title="Show a live preview of the output (hiding it frees the GPU it uses)"
              ><input type="checkbox" id="preview-toggle" checked /> Live</label
            >
            <span class="edit-controls">
              <label class="check" title="Edit layer transforms and the 3D camera directly in the preview"
                ><input type="checkbox" id="edit-toggle" /> Edit</label
              >
              <span id="gizmo-modes" class="seg" role="group" aria-label="Gizmo mode"></span>
              <label class="snap-label" title="Snap: 10/50 px when moving, 5/15° when rotating, 0.05/0.25 when scaling"
                >Snap <select id="snap-select"></select
              ></label>
            </span>
          </div>
          <div id="preview-box">
            <div id="edit-badge"></div>
            <div id="preview-off" hidden>Preview off. It frees the GPU while the output keeps running.</div>
          </div>
          <!-- The project timeline: transport, position and a ruler to scrub (TimelineStrip). -->
          <div id="timeline-strip" class="tstrip-host" role="group" aria-label="Project timeline"></div>
        </div>
        <div class="zone" id="zone-look" aria-label="Camera"></div>
      </div>
      <!--
        Right zone, in tabs: the scene (scenes, project timeline, output background, calibration),
        the datasets, the layer cards, and the timeline of the project, every layer and the camera.
      -->
      <div class="zone" id="zone-layers" aria-label="Scene, datasets, layers and timeline">
        <div class="tablist zone-tabs" role="tablist" aria-label="Scene, datasets, layers and timeline">
          <button type="button" role="tab" id="tab-scene" aria-controls="panel-scene">Scene</button>
          <button type="button" role="tab" id="tab-data" aria-controls="panel-data">Datasets <span id="badge-datasets" class="badge"></span></button>
          <button type="button" role="tab" id="tab-layers" aria-controls="panel-layers">Layers <span id="badge-layers" class="badge"></span></button>
          <button type="button" role="tab" id="tab-timeline" aria-controls="panel-timeline">Timeline <span id="badge-timeline" class="badge"></span></button>
        </div>
        <div role="tabpanel" class="zone-panel" id="panel-scene" aria-labelledby="tab-scene"></div>
        <div role="tabpanel" class="zone-panel" id="panel-data" aria-labelledby="tab-data" hidden>
          <div class="ds-toolbar">
            <button type="button" id="import-button" class="btn primary">Import file…</button>
            <input id="import-file" type="file" accept=".csv,.tsv,.txt,.json" hidden />
            <span class="muted">CSV, TSV or JSON. Copied into the project unchanged.</span>
          </div>
          <div id="datasets"></div>
        </div>
        <div role="tabpanel" class="zone-panel" id="panel-layers" aria-labelledby="tab-layers" hidden></div>
        <div role="tabpanel" class="zone-panel" id="panel-timeline" aria-labelledby="tab-timeline" hidden></div>
      </div>
    </main>

    <!-- Bottom drawer: closed it is just the tab strip (with badges); a tab opens it upwards. -->
    <section class="drawer card" id="drawer" aria-label="Data and diagnostics">
      <div class="drawer-handle" id="drawer-handle" title="Drag to resize"></div>
      <div class="tablist" role="tablist" aria-label="Data and diagnostics">
        <button type="button" role="tab" id="tab-outputs" aria-controls="panel-outputs">Output windows <span id="badge-outputs" class="badge"></span></button>
        <button type="button" role="tab" id="tab-diagnostics" aria-controls="panel-diagnostics">Diagnostics</button>
        <button type="button" role="tab" id="tab-problems" aria-controls="panel-problems">Problems <span id="badge-problems" class="badge err"></span></button>
        <button type="button" role="tab" id="tab-log" aria-controls="panel-log">Log <span id="badge-log" class="badge warn"></span></button>
        <span class="spacer"></span>
        <button type="button" id="drawer-toggle" class="drawer-toggle" aria-expanded="false" aria-controls="drawer-panels" title="Show or hide this panel">
          <svg class="icon" viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 10l4-4 4 4" /></svg>
        </button>
      </div>
      <div class="tabpanels" id="drawer-panels">
        <div role="tabpanel" id="panel-outputs" aria-labelledby="tab-outputs" tabindex="0" hidden>
          <div id="outputs-body" class="muted">No output window connected.</div>
        </div>
        <div role="tabpanel" id="panel-diagnostics" aria-labelledby="tab-diagnostics" tabindex="0" hidden>
          <div class="diagnostics">
            <label><input type="checkbox" id="diag-test-pattern" /> Test pattern <span class="muted">on the output, for focus and keystone (Calibration shows it too)</span></label>
            <label><input type="checkbox" id="diag-debug-overlay" /> Debug overlay <span class="muted">frame rate, connection, timeline and GPU name in a corner of the output</span></label>
          </div>
        </div>
        <div role="tabpanel" id="panel-problems" aria-labelledby="tab-problems" tabindex="0" hidden>
          <div id="problems" class="muted">None.</div>
        </div>
        <div role="tabpanel" id="panel-log" aria-labelledby="tab-log" hidden>
          <div id="log" tabindex="0" aria-label="Log"></div>
        </div>
      </div>
    </section>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
